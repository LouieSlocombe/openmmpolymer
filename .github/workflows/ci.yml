name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Pinned in two places that have to agree: here and the ruff rev in
      # .pre-commit-config.yaml. The formatter's output shifts between
      # releases, so a skew lets a locally clean tree fail the gate below.
      - name: Lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.8"
          args: "check ."

      - name: Check formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.8"
          args: "format --check ."

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        # -l so every step runs inside the activated environment.
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python, and the newest the whole
        # conda-forge stack solves for. If conda-forge cannot solve
        # ambertools for a new Python yet, drop that leg to the newest
        # solvable version rather than dropping ambertools: without it there
        # is no packmol and no gaff backend.
        python: ["3.12", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # conda-forge is not a preference: AmberTools is not a Python package,
      # and openmmforcefields >= 0.16 has never been published to PyPI.
      - name: Create the environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: build_tools/environment.yml
          create-args: python=${{ matrix.python }}
          cache-environment: true

      - name: Install the package
        run: python -m pip install -e . --no-deps

      - name: Report what is installed
        run: |
          python -c "import openmmpolymer; print(openmmpolymer.__version__)"
          python -c "import openmm; print('openmm', openmm.version.version)"
          python -c "import forcefill; print('forcefill', forcefill.__version__)"
          packmol < /dev/null | grep Version || true

      - name: Type check
        run: mypy

      - name: Test
        run: >
          pytest --cov --cov-branch --cov-report=term-missing
          --cov-report=xml --cov-fail-under=90

      - name: Keep the coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-py${{ matrix.python }}
          path: coverage.xml

  minimum-openmm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENMM_CPU_THREADS: "1"
      MPLCONFIGDIR: /tmp/openmmpolymer-mpl
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # This pressure/strain contract needs no parameterisation backend. Test
      # the actual API floor separately from the latest conda-forge stack.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the minimum OpenMM and test dependencies
        run: >
          python -m pip install "openmm==8.6.1" numpy rdkit matplotlib
          pytest pytest-cov "setuptools>=84.0.0"

      - name: Install the package without the force-field stack
        run: python -m pip install -e . --no-deps

      - name: Test the pressure and system APIs at the declared minimum
        run: >
          python -m pytest tests/test_stress.py tests/test_mdsystem.py
          tests/test_simulate.py tests/test_package_metadata.py --no-cov

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Create the environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: build_tools/environment.yml
          cache-environment: true

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: |
          python -m pip install twine
          python -m twine check dist/*

      # An editable checkout that imports is not the same as a wheel that
      # does: this catches a missing package-data entry, which is how py.typed
      # stops shipping without anything failing.
      - name: Install the built wheel and import it
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          python -c "import openmmpolymer; print(openmmpolymer.__version__)"
          python -c "
          import importlib.resources as resources
          assert resources.files('openmmpolymer').joinpath('py.typed').is_file()
          "
          openmmpolymer --help

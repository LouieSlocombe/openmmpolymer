name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # The same hooks a local commit runs, ruff's pinned version included.
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        # -l so every step runs inside the activated environment.
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        # The requires-python floor, and the newest Python the conda-forge
        # stack (ambertools included) solves for.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: build_tools/environment.yml
          create-args: python=${{ matrix.python }}
          cache-environment: true
      - run: python -m pip install -e . --no-deps
      - name: Report what is installed
        run: |
          python -c "import openmm, forcefill, openmmpolymer; print(openmmpolymer.__version__, 'openmm', openmm.version.version, 'forcefill', forcefill.__version__)"
          packmol < /dev/null | grep Version || true
      - run: mypy
      - run: pytest --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-py${{ matrix.python }}
          path: coverage.xml

  minimum-openmm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The pressure, system and stage APIs need no parameterisation backend,
      # so they run against the declared OpenMM floor from PyPI wheels.
      - run: python -m pip install "openmm==8.6.1" numpy rdkit matplotlib pytest pytest-cov
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest tests/test_stress.py tests/test_mdsystem.py tests/test_simulate.py --no-cov

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: build_tools/environment.yml
          cache-environment: true
      - name: Build and check the distributions
        run: |
          python -m build
          python -m twine check dist/*
      # An editable checkout that imports is not the same as a wheel that does.
      - name: Install the built wheel and import it
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          python -c "import importlib.resources as r, openmmpolymer; assert r.files('openmmpolymer').joinpath('py.typed').is_file(); print(openmmpolymer.__version__)"
          openmmpolymer --help

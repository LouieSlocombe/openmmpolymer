[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openmmpolymer"
version = "0.1.0"
description = "Build, pack, parameterise and equilibrate all-atom polymer melts with OpenMM."
readme = "README.md"
# forcefill's floor. The whole conda-forge stack (openmm, ambertools, rdkit,
# openff-toolkit) also builds for 3.14, so the ceiling is what CI runs, not what
# the ecosystem supports.
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]
keywords = ["openmm", "polymer", "molecular-dynamics", "packmol", "forcefield"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Typing :: Typed",
]
# conda-forge is the only route that resolves these. AmberTools is not a Python
# package at all (and is what supplies the `packmol` binary this package shells
# out to), and openmmforcefields >= 0.16 - forcefill's floor - has never been
# published to PyPI. `pip install openmmpolymer` will not give you a working
# install; build_tools/environment.yml will.
dependencies = [
  "numpy>=2",
  "openmm>=8.1",
  "rdkit",
  "forcefill>=1.0",
  "openff-toolkit>=0.16",
]

[project.scripts]
openmmpolymer = "openmmpolymer.__main__:main"

[project.urls]
Homepage = "https://github.com/LouieSlocombe/openmmpolymer"
Issues = "https://github.com/LouieSlocombe/openmmpolymer/issues"
Repository = "https://github.com/LouieSlocombe/openmmpolymer"

[dependency-groups]
dev = [
  "build>=1.6.0",
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.8",
  "twine>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["openmmpolymer", "openmmpolymer.*"]

[tool.setuptools.package-data]
openmmpolymer = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=openmmpolymer --cov-report=term-missing"
testpaths = ["tests"]
# Left at "error" deliberately: the whole stack (forcefill, parmed,
# openff.toolkit, openmmforcefields, rdkit) imports clean under `python -W error`.
# Add an ignore only when a real warning is observed, and quote the observed
# message in the comment - a module-scoped filter matches the module a warning is
# *attributed* to, so it silently does nothing for any library using stacklevel>=2.
filterwarnings = ["error"]
markers = [
  "forcefield: parameterises a chain through forcefill; needs AmberTools/OpenFF (deselect with -m 'not forcefield')",
  "packmol: shells out to the real packmol binary; needs it on PATH (deselect with -m 'not packmol')",
  "slow: runs more than a second of real dynamics (deselect with -m 'not slow')",
  "cuda: needs a working CUDA platform (deselect with -m 'not cuda')",
]

[tool.coverage.run]
branch = true
source = ["openmmpolymer"]

[tool.coverage.report]
# The engine adapters (openmm, packmol, forcefill) cannot be fully branch-covered
# without the heavy legs, which the fast CI job deselects. The floor sits below
# the achieved number so coverage-neutral changes pass; raise it as coverage
# improves.
fail_under = 90
show_missing = true
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
src = ["."]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
files = ["openmmpolymer", "tests"]
python_version = "3.12"
pretty = true
show_error_codes = true
strict = true
warn_unreachable = true

# None of these ship type information. `openmm.*` does not match the top-level
# module `openmm`, so both are listed. rdkit ships rdkit-stubs and forcefill
# ships py.typed, so neither belongs here - and `strict` implies
# warn_unused_configs, so an override that matches nothing fails the type check.
[[tool.mypy.overrides]]
module = ["openmm", "openmm.*", "openff.*", "parmed.*"]
ignore_missing_imports = true

# forcefill ships py.typed, but how it resolves depends on how it was
# installed: a PEP 660 editable install is not importable by mypy at all, and a
# source checkout on MYPYPATH gets its own body type-checked, reporting that
# package's errors as this one's. Neither is this package's business, and its
# calls into forcefill are wrapped in try/except with errors re-raised as
# ForceFieldError, so the loss is small.
[[tool.mypy.overrides]]
module = ["forcefill", "forcefill.*"]
follow_imports = "silent"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openmmpolymer"
version = "0.1.0"
description = "Build, pack, parameterise and equilibrate all-atom polymer melts with OpenMM."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]
keywords = ["openmm", "polymer", "molecular-dynamics", "packmol", "forcefield"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Typing :: Typed",
]
# Declared for completeness; only conda-forge resolves them, because
# AmberTools (which supplies packmol) is not a Python package and
# openmmforcefields >= 0.16 is not on PyPI. See build_tools/environment.yml.
dependencies = [
  "numpy>=2.5.3",
  "openmm>=8.6.1",
  "rdkit",
  "forcefill>=1.0",
  "openff-toolkit>=0.16",
  "MDAnalysis>=2.10",
  "matplotlib>=3.8",
]

[project.scripts]
openmmpolymer = "openmmpolymer.__main__:main"

[project.urls]
Homepage = "https://github.com/LouieSlocombe/openmmpolymer"
Issues = "https://github.com/LouieSlocombe/openmmpolymer/issues"
Repository = "https://github.com/LouieSlocombe/openmmpolymer"

[tool.setuptools.packages.find]
include = ["openmmpolymer", "openmmpolymer.*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov --cov-report=term-missing"
testpaths = ["tests"]
# Warnings are errors. Each ignore quotes a warning actually observed, and
# matches on its message: a module filter matches the module a warning is
# attributed to, which for a library using stacklevel >= 2 is the caller.
filterwarnings = [
  "error",
  # netCDF4, reached through parmed when forcefill is imported, was compiled
  # against a different numpy: "numpy.ndarray size changed, may indicate
  # binary incompatibility".
  "ignore:numpy.ndarray size changed:RuntimeWarning",
  # OpenFF Sage carries virtual-site parameters, so the preset NAGL charges
  # this package hands it trigger PresetChargesAndVirtualSitesWarning on every
  # run. It matters only when a polymer gets virtual sites, which
  # PolymerForceField.virtual_site_residues reports.
  "ignore:Preset charges were provided",
]
markers = [
  "forcefield: parameterises a chain through forcefill; needs AmberTools/OpenFF",
  "packmol: shells out to the real packmol binary; needs it on PATH",
  "slow: runs more than a second of real dynamics",
]

[tool.coverage.run]
branch = true
source = ["openmmpolymer"]

[tool.coverage.report]
fail_under = 90
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
files = ["openmmpolymer", "tests"]
python_version = "3.12"
pretty = true
strict = true
warn_unreachable = true

# Packages without type information. A wildcard does not match the top-level
# module it names, hence both spellings.
[[tool.mypy.overrides]]
module = [
  "openmm",
  "openmm.*",
  "openff.*",
  "openmmforcefields.*",
  "MDAnalysis",
  "MDAnalysis.*",
]
ignore_missing_imports = true

# forcefill ships py.typed, but an editable install of it is invisible to mypy
# and a source checkout gets its own body type-checked. Its calls here are
# wrapped and re-raised as ForceFieldError, so following it adds little.
[[tool.mypy.overrides]]
module = ["forcefill", "forcefill.*"]
follow_imports = "silent"
ignore_missing_imports = true

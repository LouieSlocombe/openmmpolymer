# Runtime and development environment for openmmpolymer:
#
#   conda env create -f build_tools/environment.yml
#   conda activate openmmpolymer
#   python -m pip install -e . --no-deps
#
# conda-forge is the only route that resolves: AmberTools is not a Python
# package (and is what ships the `packmol` executable this package shells out
# to), and openmmforcefields >= 0.16 has never been published to PyPI.
name: openmmpolymer

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python>=3.12
  - pip
  - numpy>=2.5.3
  - openmm>=8.6.1
  - rdkit
  - parmed
  # antechamber and parmchk2 for forcefill's gaff backend, and the packmol
  # executable. conda-forge's own packmol builds pin numpy < 2, so asking for
  # it separately makes the environment unsolvable.
  - ambertools
  - openff-toolkit>=0.16
  - openmmforcefields>=0.16
  # The graph-neural-network charges: without them, anything longer than a
  # DP 15 chain needs AM1-BCC, and sqm is the wall.
  - openff-nagl
  - openff-nagl-models
  # Lowercase on conda-forge. 2.10 is the first release built for Python 3.14.
  - mdanalysis>=2.10
  # The plots build a Figure directly and never touch pyplot, so no GUI toolkit.
  - matplotlib-base>=3.8
  - pytest
  - pytest-cov
  - mypy
  - pre-commit
  - python-build
  - twine
  - pip:
      - forcefill>=1.0
